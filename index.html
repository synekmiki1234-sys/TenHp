<!DOCTYPE html><html lang="pl"><head><meta charset="utf-8"><title>TENHP 3D</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<style>
:root{--bg:#140a1e;--fg:#fff3e6;--mu:#c9a9c9;--ac:#ff8a3d;--a2:#ff2d75;--pn:#24102ecc}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%}#gl{display:none}#xh{left:50%;top:50%;width:200px;height:200px;transform:translate(-50%,-50%);display:none;pointer-events:none;z-index:3}
.scr{position:fixed;inset:0;z-index:5;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:14px;overflow:auto;touch-action:pan-y}.scr.on{display:flex}
h1{margin:0;font:900 clamp(40px,11vw,84px)/1 Impact,'Arial Black',sans-serif;letter-spacing:3px;background:linear-gradient(#ffd23d,#ff2d75);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #000a);animation:fl 4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-6px) rotate(-1deg)}}
.sub{color:var(--mu);text-align:center}
.card{background:var(--pn);border:1px solid #5a2f5a;border-radius:8px;padding:16px;width:min(420px,100%);display:flex;flex-direction:column;gap:9px;backdrop-filter:blur(6px)}
button,input,select{font:inherit;color:var(--fg);border-radius:6px;border:1px solid #6b3a6b;background:#1b0d26;padding:11px 14px;touch-action:manipulation}input[type=color]{padding:2px;height:40px}
button{cursor:pointer;font-weight:700}button:active{transform:scale(.97)}button.p{background:linear-gradient(135deg,#ff8a3d,#ff2d75);border:0}button.d{background:#4a1230}button:disabled{opacity:.4}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.tabs .a{background:var(--ac);color:#210}
.err{color:#ff7a9a;min-height:18px;font-size:13px}.st{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;font-size:12px;color:var(--mu)}.st b{display:block;font-size:20px;color:var(--fg)}
.badge{background:#ffd23d;color:#210;border-radius:4px;padding:1px 6px;font-size:11px;font-weight:800;margin-left:6px}
.pl{display:flex;align-items:center;gap:8px;padding:8px;background:#1b0d26;border-radius:6px}.pl span{flex:1}.ar{display:flex;gap:6px}.ar button{flex:1;font-size:12px;padding:9px 3px}.ar .a{border-color:var(--ac);color:var(--ac)}
#hud{position:fixed;z-index:3;top:calc(8px + env(safe-area-inset-top,0px));left:0;right:0;display:none;justify-content:space-between;padding:0 12px;pointer-events:none;font-weight:800;text-shadow:0 2px 4px #000}
#hp{display:flex;gap:3px;margin-top:4px}#hp i{width:16px;height:9px;background:#222;border-radius:2px}#hp i.o{background:linear-gradient(#ff8a3d,#ff2d75)}#sc{font-size:26px}#am{text-align:right}
#bn{position:fixed;z-index:6;top:28%;left:0;right:0;text-align:center;font:900 clamp(24px,6vw,48px) Impact,sans-serif;pointer-events:none;opacity:0;text-shadow:0 0 14px #000}#bn.s{animation:bn 1.8s}@keyframes bn{0%{opacity:0;transform:scale(.6)}15%,75%{opacity:1;transform:scale(1)}100%{opacity:0}}
#dm{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(transparent 40%,#f03);opacity:0;transition:opacity .35s}
#tag{position:fixed;z-index:3;display:none;transform:translate(-50%,-100%);font-weight:800;text-shadow:0 1px 3px #000;text-align:center;font-size:13px;pointer-events:none}
#ex{position:fixed;z-index:7;top:calc(8px + env(safe-area-inset-top,0px));right:10px;display:none;padding:6px 10px;font-size:12px}
#tc{position:fixed;inset:0;z-index:4;display:none;touch-action:none}#tc.on{display:block}#tc .z{position:absolute;top:0;bottom:0;width:50%}
.tb{position:absolute;border-radius:50%;background:#2410309a;border:2px solid #fff8;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;touch-action:none;transform:translate(-50%,-50%)}.tb.dn{background:#ff8a3da0}#tc.ed .tb{outline:2px dashed #ffd23d}#tc.ed .tb.sl{outline:3px solid #ffd23d;background:#ffd23d55}
#js{position:absolute;width:110px;height:110px;margin:-55px;border-radius:50%;border:2px solid #fff6;display:none}#js i{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:#fff6}
#edb{position:fixed;z-index:30;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:none;gap:8px;align-items:center;background:#000b;padding:8px;border-radius:8px;flex-wrap:wrap;justify-content:center;width:min(520px,96%)}
#inv{z-index:9;background:#000a}
</style></head><body>
<canvas id="bg"></canvas><canvas id="gl"></canvas><canvas id="xh" width="200" height="200"></canvas><div id="dm"></div>
<div id="hud"><div><div id="nm">/tenhp</div><div id="hp"></div></div><div id="sc"></div><div id="am"></div></div><div id="tag"></div><div id="bn"></div><button id="ex" class="d">WYJDŹ</button>
<div id="tc"><div class="z" id="zl" style="left:0"></div><div class="z" id="zr" style="right:0"></div><div id="js"><i></i></div></div>
<div id="edb"><span id="edl">Dotknij przycisk</span><input type="range" id="esz" min="40" max="150" style="min-width:120px"><button class="p" id="edsv">Zapisz</button><button id="edrs">Reset</button><button id="edc">Anuluj</button></div>

<div class="scr on" id="s-auth"><h1>TENHP 3D</h1><div class="sub">Deagle 1v1 · /tenhp · 10 HP</div>
<div class="card"><div class="row tabs"><button id="tl" class="a">Logowanie</button><button id="tr">Nowe konto</button></div>
<input id="un" placeholder="Nazwa gracza" maxlength="16" autocomplete="username"><input id="pw" type="password" placeholder="Hasło"><input id="pw2" type="password" placeholder="Powtórz hasło" style="display:none">
<input id="sv" placeholder="Adres serwera (wss://…)" style="font-size:12px"><div class="err" id="ae"></div><button class="p" id="ab">ZALOGUJ</button></div></div>
<div class="scr" id="s-menu"><h1>TENHP 3D</h1><div class="sub" id="who"></div><div class="card"><div class="st" id="stats"></div><button class="p" id="b-lobby">LOBBY 1v1</button><button id="b-set">Celownik i sterowanie</button><button class="d" id="b-out">Wyloguj</button></div>
<div class="sub" style="font-size:12px">PC: WASD · Shift bieg · C kucanie · Spacja skok · PPM celuj · LPM strzał · R przeładuj</div></div>
<div class="scr" id="s-lobby"><h1 style="font-size:40px">LOBBY</h1><div class="card"><div class="ar" id="ars"></div><div id="plist" style="display:flex;flex-direction:column;gap:6px"></div><button id="ann" style="display:none">Ogłoszenie (admin)</button><div class="err" id="le"></div><button id="lb">Wróć</button></div></div>
<div class="scr" id="s-set"><h1 style="font-size:40px">USTAWIENIA</h1><div class="card">
<div class="row"><span>Celownik</span><select id="cm"><option value="dyn">Dynamiczny</option><option value="sta">Statyczny</option></select></div>
<div class="row"><span>Styl</span><select id="cs"><option value="cross">Krzyż</option><option value="dot">Kropka</option><option value="circ">Okrąg</option><option value="t">Litera T</option></select></div>
<div class="row"><span>Kolor</span><input type="color" id="cc"></div><div class="row"><span>Rozmiar</span><input type="range" id="cz" min="6" max="30"></div><div class="row"><span>Czułość</span><input type="range" id="se" min="1" max="10"></div>
<canvas id="pv" width="120" height="120" style="position:static;width:120px;height:120px;align-self:center;background:#3a2a4a;border-radius:8px"></canvas>
<button id="mp">Mapuj i skaluj przyciski (mobile)</button><button class="p" id="sb">Zapisz i wróć</button></div></div>
<div class="scr" id="inv"><div class="card"><div id="it" style="text-align:center;font-size:18px"></div><button class="p" id="ia">Akceptuj</button><button class="d" id="id">Odrzuć</button></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const SERVER=/^https?:$/.test(location.protocol)&&!/itch|hwcdn/.test(location.host)?(location.protocol==='https:'?'wss://':'ws://')+location.host:'wss://TWOJ-SERWER.up.railway.app';
const $=s=>$d.querySelector(s),$d=document;
const LS=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}};
const cfg=Object.assign({mode:'dyn',style:'cross',size:14,color:'#ffd23d',sens:5},LS('cfg')||{});
const DL={fire:[82,62,88],ads:[70,40,64],sprint:[90,38,64],crouch:[58,84,60],jump:[92,82,64]},BL={fire:'STRZAŁ',ads:'CELUJ',sprint:'BIEG',crouch:'KUC',jump:'SKOK'};
const cp=o=>JSON.parse(JSON.stringify(o));let lay=Object.assign(cp(DL),LS('lay2')||{});
const touch=matchMedia('(pointer:coarse)').matches||'ontouchstart' in window;
const AR=[
{n:'Magazyn LS',s:[22,14],g:0x4a4458,sky:0xff9a5a,sp:[[-18,0],[18,0]],b:[[-8,-5,2,8,3.2,0x7a5a3a],[8,5,2,8,3.2,0x7a5a3a],[0,0,3,3,1.4,0x9a7a4a],[-12,8,3,3,2.4,0x6a4a2a],[12,-8,3,3,2.4,0x6a4a2a],[0,-10,8,1.2,3,0x555a66],[0,10,8,1.2,3,0x555a66]]},
{n:'Dach Vinewood',s:[18,18],g:0x3a3a4a,sky:0xc05ad0,sp:[[0,-15],[0,15]],b:[[-7,-4,4,4,2.8,0x5a6a8a],[7,-4,4,4,2.8,0x5a6a8a],[-7,6,4,4,2.8,0x5a6a8a],[7,6,4,4,2.8,0x5a6a8a],[0,1,3,3,1.2,0xd05a8a]]},
{n:'Plaża Santa Maria',s:[26,12],g:0xd9b873,sky:0x5ac8ff,sp:[[-22,0],[22,0]],b:[[-9,-5,1.2,6,2.8,0xa0633a],[-9,6,1.2,5,2.8,0xa0633a],[9,-6,1.2,5,2.8,0xa0633a],[9,5,1.2,6,2.8,0xa0633a],[0,0,2.5,2.5,1.5,0x3a8a9a]]}];
let ws,me=null,adm=0,sel=0,reg=false,editing=false,inGame=false,invD=null,pend=0,url=LS('srv')||SERVER;
const send=o=>ws&&ws.readyState===1&&ws.send(JSON.stringify(o));
function scr(id){$d.querySelectorAll('.scr').forEach(e=>e.classList.toggle('on',e.id==='s-'+id||e.id===id))}
function banner(t,c){const b=$('#bn');b.textContent=t;b.style.color=c||'#fff';b.classList.remove('s');void b.offsetWidth;b.classList.add('s')}
/* ----- sieć ----- */
function conn(cb){if(ws&&ws.readyState===1)return cb();$('#ae').textContent='Łączenie…';try{ws=new WebSocket(url)}catch(e){return $('#ae').textContent='Zły adres serwera'}
 ws.onopen=()=>{$('#ae').textContent='';cb()};ws.onmessage=e=>net(JSON.parse(e.data));
 ws.onerror=()=>{$('#ae').textContent='Nie można połączyć z serwerem'};ws.onclose=()=>{if(me){me=null;if(inGame)exitGame();scr('auth');$('#ae').textContent='Rozłączono z serwerem'}}}
$('#sv').value=url;$('#sv').onchange=e=>{url=e.target.value.trim();LS('srv',url);try{ws&&ws.close()}catch(e){}ws=null};
$('#tl').onclick=()=>tab(false);$('#tr').onclick=()=>tab(true);
function tab(r){reg=r;$('#tl').classList.toggle('a',!r);$('#tr').classList.toggle('a',r);$('#pw2').style.display=r?'':'none';$('#ab').textContent=r?'UTWÓRZ KONTO':'ZALOGUJ';$('#ae').textContent=''}
let akey;$('#ab').onclick=()=>{const n=$('#un').value.trim(),p=$('#pw').value;if(reg&&p!==$('#pw2').value)return $('#ae').textContent='Hasła się różnią';conn(()=>send({t:'auth',m:reg?'reg':'login',n,p,k:akey}))};
$('#b-out').onclick=()=>{me=null;try{ws.close()}catch(e){}ws=null;scr('auth')};
function net(m){switch(m.t){
 case'err':$('#ae').textContent=m.m;if(m.key){akey=prompt('Klucz admina:')||'';}break;
 case'ok':me=m.a;adm=m.adm;menu();break;
 case'lob':lobL=m.l;renderLobby();break;
 case'inv':if(inGame)break;invD=m;$('#it').textContent=m.from+' zaprasza Cię na 1v1 — '+AR[m.ar].n;$('#inv').classList.add('on');break;
 case'dec':pend=0;$('#le').textContent='Zaproszenie odrzucone';renderLobby();break;
 case'ann':banner(m.from+': '+m.x,'#ffd23d');break;
 case'go':startGame(m);break;
 case'p':O.t=m.v;break;
 case'f':tracer(new THREE.Vector3(...m.o),new THREE.Vector3(...m.e),0xffd23d);flash(O.m);break;
 case's':S.hp=m.hp;S.sc=m.sc;S.am=m.am;if(m.ev==='me'){die()}else if(m.ev==='opp')banner('ZABIŁEŚ!','#ffd23d');break;
 case'rs':respawn();break;
 case'end':me=m.a;finish(m);break}}
function menu(){const lv=Math.floor(me.xp/100)+1;$('#who').textContent=me.n;if(adm){const b=$d.createElement('span');b.className='badge';b.textContent='ADMIN';$('#who').append(b)}
 $('#stats').innerHTML=[['Poziom',lv],['Wygrane',me.w],['Zabójstwa',me.k],['Śmierci',me.d]].map(x=>`<div><b>${x[1]}</b>${x[0]}</div>`).join('');scr('menu')}
/* ----- ustawienia ----- */
function drawCross(c,x,y,sp){const g=cfg.mode==='dyn'?4+sp*600:6,s=cfg.size;c.strokeStyle=c.fillStyle=cfg.color;c.lineWidth=2.4;c.shadowColor='#000';c.shadowBlur=3;c.beginPath();
 if(cfg.style==='cross'||cfg.style==='t'){[[1,0],[-1,0],[0,1],[0,-1]].forEach(([a,b])=>{if(cfg.style==='t'&&b===-1)return;c.moveTo(x+a*g,y+b*g);c.lineTo(x+a*(g+s),y+b*(g+s))});c.stroke()}
 else if(cfg.style==='dot'){c.arc(x,y,2.5+s/8,0,7);c.fill();c.beginPath();c.arc(x,y,g+s/3,0,7);c.globalAlpha=.5;c.stroke();c.globalAlpha=1}else{c.arc(x,y,g+s/2,0,7);c.stroke();c.beginPath();c.arc(x,y,2,0,7);c.fill()}c.shadowBlur=0}
const pv=()=>{const c=$('#pv').getContext('2d');c.clearRect(0,0,120,120);drawCross(c,60,60,.015)};
$('#b-set').onclick=()=>{$('#cm').value=cfg.mode;$('#cs').value=cfg.style;$('#cc').value=cfg.color;$('#cz').value=cfg.size;$('#se').value=cfg.sens;$('#mp').style.display=touch?'':'none';pv();scr('set')};
['cm','cs','cc','cz','se'].forEach(i=>$('#'+i).oninput=()=>{cfg.mode=$('#cm').value;cfg.style=$('#cs').value;cfg.color=$('#cc').value;cfg.size=+$('#cz').value;cfg.sens=+$('#se').value;pv()});
$('#sb').onclick=()=>{LS('cfg',cfg);scr('menu')};
/* ----- przyciski dotykowe + edytor ----- */
const T={mx:0,my:0,fire:0,ads:0,sprint:0,crouch:0,jump:0};let esel=null,bak;
function place(b,k){const l=lay[k];b.style.left=l[0]+'%';b.style.top=l[1]+'%';b.style.width=b.style.height=l[2]+'px'}
function buildTB(){$d.querySelectorAll('.tb').forEach(e=>e.remove());
 for(const k in BL){const b=$d.createElement('div');b.className='tb';b.id='tb_'+k;b.textContent=BL[k];place(b,k);
  b.onpointerdown=e=>{e.stopPropagation();b.setPointerCapture(e.pointerId);if(editing){b._d=1;esel=k;$d.querySelectorAll('.tb').forEach(x=>x.classList.toggle('sl',x===b));$('#esz').value=lay[k][2];$('#edl').textContent=BL[k]}else{T[k]=1;b.classList.add('dn')}};
  b.onpointermove=e=>{if(editing&&b._d){lay[k][0]=Math.max(4,Math.min(96,e.clientX/innerWidth*100));lay[k][1]=Math.max(6,Math.min(94,e.clientY/innerHeight*100));place(b,k)}};
  b.onpointerup=b.onpointercancel=()=>{b._d=0;if(!editing){T[k]=0;b.classList.remove('dn')}};$('#tc').append(b)}}
$('#esz').oninput=e=>{if(!esel)return;lay[esel][2]=+e.target.value;place($('#tb_'+esel),esel)};
$('#mp').onclick=()=>{editing=true;bak=cp(lay);esel=null;buildTB();$('#tc').className='on ed';$('#edb').style.display='flex';scr('none')};
function endEdit(sv){if(sv)LS('lay2',lay);else lay=bak;editing=false;$('#tc').className='';$('#edb').style.display='none';scr('set')}
$('#edsv').onclick=()=>endEdit(1);$('#edc').onclick=()=>endEdit(0);$('#edrs').onclick=()=>{lay=cp(DL);buildTB();esel=null};
let jp=null,ap=null;const jsE=$('#js');
$('#zl').onpointerdown=e=>{if(editing)return;jp={id:e.pointerId,x:e.clientX,y:e.clientY};e.target.setPointerCapture(e.pointerId);jsE.style.display='block';jsE.style.left=e.clientX+'px';jsE.style.top=e.clientY+'px'};
$('#zl').onpointermove=e=>{if(!jp||e.pointerId!==jp.id)return;let dx=e.clientX-jp.x,dy=e.clientY-jp.y,l=Math.hypot(dx,dy);if(l>50){dx*=50/l;dy*=50/l}T.mx=dx/50;T.my=dy/50;jsE.firstChild.style.transform=`translate(${dx}px,${dy}px)`};
$('#zl').onpointerup=$('#zl').onpointercancel=()=>{jp=null;T.mx=T.my=0;jsE.style.display='none';jsE.firstChild.style.transform=''};
$('#zr').onpointerdown=e=>{if(editing)return;ap={id:e.pointerId,x:e.clientX,y:e.clientY};e.target.setPointerCapture(e.pointerId)};
$('#zr').onpointermove=e=>{if(!ap||e.pointerId!==ap.id)return;look(e.clientX-ap.x,e.clientY-ap.y,1.6);ap.x=e.clientX;ap.y=e.clientY};
$('#zr').onpointerup=$('#zr').onpointercancel=()=>{ap=null};
/* ----- PC ----- */
const K={},M={l:0,r:0};
addEventListener('keydown',e=>{K[e.key.length===1?e.key.toLowerCase():e.key]=1;if(e.key===' ')e.preventDefault()});addEventListener('keyup',e=>{K[e.key.length===1?e.key.toLowerCase():e.key]=0});
const gl=$('#gl');gl.oncontextmenu=e=>e.preventDefault();
gl.onmousedown=e=>{if(!touch&&$d.pointerLockElement!==gl){gl.requestPointerLock&&gl.requestPointerLock();return}if(e.button===0)M.l=1;if(e.button===2)M.r=1};
addEventListener('mouseup',e=>{if(e.button===0)M.l=0;if(e.button===2)M.r=0});
addEventListener('mousemove',e=>{if($d.pointerLockElement===gl)look(e.movementX,e.movementY,1)});
/* ----- lobby ----- */
let lobL=[];
$('#b-lobby').onclick=()=>{$('#ars').innerHTML='';AR.forEach((a,i)=>{const b=$d.createElement('button');b.textContent=a.n;b.className=i===sel?'a':'';b.onclick=()=>{sel=i;[...$('#ars').children].forEach((x,j)=>x.className=j===i?'a':'')};$('#ars').append(b)});$('#ann').style.display=adm?'':'none';$('#le').textContent='';renderLobby();scr('lobby')};
$('#lb').onclick=()=>scr('menu');
function renderLobby(){const L=$('#plist');L.innerHTML='';const ps=lobL.filter(p=>p.n!==me.n);
 if(!ps.length){const d=$d.createElement('div');d.className='sub';d.textContent='Brak innych graczy online';L.append(d)}
 ps.forEach(p=>{const r=$d.createElement('div');r.className='pl';const s=$d.createElement('span');s.textContent=p.n+' · lvl '+p.lv;if(p.adm){const b=$d.createElement('b');b.className='badge';b.textContent='ADMIN';s.append(b)}
  const b=$d.createElement('button');b.className='p';b.textContent=p.st==='game'?'W grze':'Zaproś';b.disabled=p.st==='game'||pend;b.onclick=()=>{pend=1;send({t:'inv',to:p.id,ar:sel});$('#le').textContent='Wysłano zaproszenie do '+p.n;setTimeout(()=>{pend=0;renderLobby()},15000);renderLobby()};r.append(s,b);L.append(r)})}
$('#ann').onclick=()=>{const x=prompt('Treść ogłoszenia:');if(x)send({t:'ann',x})};
$('#ia').onclick=()=>{$('#inv').classList.remove('on');if(invD)send({t:'acc',to:invD.fid});invD=null};$('#id').onclick=()=>{$('#inv').classList.remove('on');if(invD)send({t:'dec',to:invD.fid});invD=null};
const iaO=$('#ia').onclick,idO=$('#id').onclick;
/* ----- 3D ----- */
const R=new THREE.WebGLRenderer({canvas:gl,antialias:true});R.shadowMap.enabled=true;
const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(70,1,.1,200),world=new THREE.Group();sc.add(world);
sc.add(new THREE.HemisphereLight(0xffffff,0x554466,.9));const sun=new THREE.DirectionalLight(0xffe0b0,.9);sun.position.set(15,25,10);sun.castShadow=true;sun.shadow.camera.left=sun.shadow.camera.bottom=-30;sun.shadow.camera.right=sun.shadow.camera.top=30;sc.add(sun);
function rs(){const d=Math.min(devicePixelRatio||1,2);R.setPixelRatio(d);R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();for(const c of[$('#bg')]){c.width=innerWidth*d;c.height=innerHeight*d}}addEventListener('resize',rs);rs();
